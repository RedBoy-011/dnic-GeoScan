name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.3.6.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.3.6-apk
          path: release/Dnic-GeoScan-v1.3.6.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.3.6
          name: "Dnic-GeoScan v1.3.6 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.3.6 - Absolute Zero-Hang Splash & Guaranteed Offline Local Analysis
            
            نسخه رسمی ۱.۳.۶ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و اصلاحات کلیدی این نسخه:
            - **رفع ریشه‌ای و قطعی گیر کردن روی اسپلش شش‌ضلعی نئونی در اندروید ۱۲+:**
              - پیاده‌سازی لیسنر خروج فوری `splashScreen.setOnExitAnimationListener { it.remove() }` در `MainActivity` جهت حذف بلادرنگ ویوی اسپلش بدون معطلی برای انیماتورهای سیستمی OEM (مانند سامسونگ OneUI و شیائومی HyperOS/MIUI).
              - حذف مقدار صلب `windowSplashScreenAnimationDuration = 0` در `themes.xml` جهت هماهنگی کامل با کامپوزیتور گرافیکی سیستم‌عامل.
            - **اولویت قطعی تحلیل آفلاین محلی (Local Analysis Priority):**
              - امکان ورود فوری و کار با شبکه‌های کوچک و بزرگ میدانی (۵×۵، ۱۰×۱۰، ۲۰×۲۰، ۳۰×۳۰) و فایل‌های دلخواه بدون نیاز به بلوتوث.
              - نرمال‌سازی میانه (Median Ground Zero) و درون‌یابی دو مکعبی (Bicubic Spline) کاملاً پایدار و بدون کرش.
            - **نمایش شفاف و استاندارد وضعیت عدم اتصال سخت‌افزار (Disconnected Status):**
              - کارت برجسته وضعیت عدم اتصال با متن صریح `STATUS: DISCONNECTED • NO HARDWARE CONNECTED` و دکمه‌های اقدام سریع مستقیم.
            - **ارتقای یکپارچه درجا (In-place Upgrade):** امضا با همان کلید دائم معتبر با `versionCode = 22`.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.3.6.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.3.6/Dnic-GeoScan-v1.3.6.apk)**
          files: release/Dnic-GeoScan-v1.3.6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
