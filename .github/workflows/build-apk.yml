name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.1.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.1.3-apk
          path: release/Dnic-GeoScan-v1.1.3.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.1.3
          name: "Dnic-GeoScan v1.1.3 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.1.3 - Direct Grid Shortcuts & Polished Navigation Release

            نسخه رسمی ۱.۱.۳ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و قابلیت‌های این نسخه:
            - **میانبرهای مستقیم شبکه‌های ۱۰×۱۰ و ۲۰×۲۰ در هاب اصلی:** دسترسی بلادرنگ از کارت Local Analysis به تست‌های سریع و شبیه‌سازی گرادیان‌های مغناطیسی با یک کلیک.
            - **تضمین قطعی خروج از اسپلش‌اسکرین (`setKeepOnScreenCondition { false }`):** خروج صفر میلی‌ثانیه‌ای و روان به رابط کاربری اصلی.
            - **تفکیک کامل و سریع بین حالت‌های مأموریت:** حرکت بدون مکث بین هاب عملیاتی، آنالیز آفلاین، و مانیتورینگ بلوتوث.
            - **نمایش شفاف وضعیت عدم اتصال:** برچسب استاندارد `STATUS: DISCONNECTED • NO HARDWARE CONNECTED`.
            - **ارتقای درجا (In-place Upgrade):** امضا با همان کلید دائم معتبر با `versionCode = 7` جهت نصب و آپدیت بدون نقص.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.1.3.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.1.3/Dnic-GeoScan-v1.1.3.apk)**
          files: release/Dnic-GeoScan-v1.1.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
