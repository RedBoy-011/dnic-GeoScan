name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.4.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.4.0-apk
          path: release/Dnic-GeoScan-v1.4.0.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.4.0
          name: "Dnic-GeoScan v1.4.0 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.4.0 - Watchdog Splash Dismissal, Dual Mode Landing & Enhanced Disconnected Status
            
            نسخه رسمی ۱.۴.۰ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و اصلاحات کلیدی این نسخه:
            - **رفع قطعی و ایمن فریز اسپلش‌اسکرین (Watchdog Protected Splash Dismissal):**
              - افزودن تم اختصاصی `values-v31/themes.xml` با تعاریف نیتیو سیستم‌عامل برای اندروید ۱۲ به بعد.
              - پیاده‌سازی تایمر سگ‌نگهبان (Watchdog Timer - 250ms) همراه با انیمیشن خروج شفاف ۱۲۰ میلی‌ثانیه‌ای و حذف تضمینی لایه اسپلش در `MainActivity.kt`.
            - **بازطراحی ناوبری و هاب اصلی با دو کارت بزرگ و انتخابگر مستقیم (Dual Mode Landing Screen):**
              - افزوده شدن نوار انتخابگر مستقیم دوگانه در بالای هاب برای سوئیچ ۱-کلیکه بین `LOCAL ANALYSIS (100% OFFLINE)` و `REMOTE SCAN (HC-05)`.
              - دو کارت مجزا و بزرگ با اولویت‌بندی تحلیل آفلاین محلی و دسترسی سریع به شبکه‌های ۵×۵، ۱۰×۱۰، ۲۰×۲۰ و ۳۰×۳۰.
            - **نمایش شفاف وضعیت عدم اتصال سخت‌افزار (STATUS: DISCONNECTED • NO HARDWARE CONNECTED):**
              - بردر برجسته نارنجی نئونی در کارت وضعیت سخت‌افزار همراه با دکمه انتقال فوری به حالت آفلاین در صفحه اسکن زنده.
            - **پایداری کامل محاسبات ژئوفیزیک (Bicubic Spline & Median Ground Zero):**
              - اجرای بدون کرش الگوریتم درون‌یابی کتمول-رام و نرمال‌سازی ترند روی ماتریس‌های ۱۰×۱۰، ۲۰×۲۰ و فایل‌های متنی/CSV.
            - **ارتقای یکپارچه درجا (In-place Upgrade):** امضا با همان کلید دائم معتبر با `versionCode = 26`.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.4.0.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.4.0/Dnic-GeoScan-v1.4.0.apk)**
          files: release/Dnic-GeoScan-v1.4.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
