name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.1.0-apk
          path: release/Dnic-GeoScan-v1.1.0.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.1.0
          name: "Dnic-GeoScan v1.1.0 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.1.0 - Major Navigation & Offline Analysis Release

            نسخه رسمی ۱.۱.۰ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و قابلیت‌های این نسخه:
            - **صفحه فرود و هاب عملیاتی (Landing Mission Hub):** طراحی رابط کاربری دوکارته مدرن برای انتخاب سریع حالت و شروع آنی عملیات.
            - **اولویت ویژه حالت تحلیل محلی (Local Analysis First):** باز کردن و آنالیز مستقیم شبکه‌های ۱۰×۱۰، ۲۰×۲۰ و سفارشی (CSV/TXT) کاملاً آفلاین و ۱۰۰٪ مستقل از بلوتوث.
            - **حل قطعی اسپلش‌اسکرین (Official Android 12+ SplashScreen API):** پیاده‌سازی کتابخانه رسمی `androidx.core:core-splashscreen` جهت انتقال بدون وقفه و صفر میلی‌ثانیه‌ای به Compose.
            - **نمایش شفاف وضعیت عدم اتصال:** برچسب واضح و حرفه‌ای `STATUS: DISCONNECTED • NO HARDWARE CONNECTED` به همراه راهنمای وضعیت آماده‌باش.
            - **ارتقای یکپارچه و مستقیم:** امضا با کلید اختصاصی دائم و افزایش به `versionCode = 4` جهت آپدیت درجا روی نسخه‌های قبل بدون نیاز به حذف برنامه.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.1.0.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.1.0/Dnic-GeoScan-v1.1.0.apk)**
          files: release/Dnic-GeoScan-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
