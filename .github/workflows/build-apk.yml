name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.2.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.2.1-apk
          path: release/Dnic-GeoScan-v1.2.1.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.2.1
          name: "Dnic-GeoScan v1.2.1 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.2.1 - 2D Transect Profile & Magnetic Cross-Section Engine

            نسخه رسمی ۱.۲.۱ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و قابلیت‌های اصلی این نسخه:
            - **ماژول ترانسکت و مقطع دوبعدی عمق (2D Transect Cross-Section Engine):**
              - ابزار ترسیم پروفیل خطی با اسلایدر پیمایش در طول سطرها و ستون‌های شبکه.
              - رندرینگ سریع مبتنی بر Canvas نیتیو Compose با نمایش خط مبنای زمین (Ground Zero) و تعیین پیک آنومالی.
            - **فیلترهای مشتق اول عمودی (1VD) و سیگنال تحلیلی (AS):** آشکارسازی لبه‌های ساختار و حذف خطای شیب دوقطبی مغناطیس.
            - **پیش‌بارگذاری آنی داده‌های مرجع ژئوفیزیکی در ورود به آنالیز محلی:** بارگذاری پیش‌فرض شبکه استاندارد ۱۰×۱۰ در شروع به کار.
            - **پشتیبانی سراسری از جداکننده‌های فاصله‌ای (Space-delimited Matrix & Triplet).**
            - **تضمین قطعی حذف لنگر اسپلش و انتقال فوری به Compose.**
            - **ناوبری ارگونومیک با سوییچرهای بالایی `LOCAL` و `REMOTE`.**
            - **نمایش شفاف وضعیت عدم اتصال سخت‌افزار (`STATUS: DISCONNECTED • NO HARDWARE CONNECTED`).**
            - **ارتقای یکپارچه درجا (In-place Upgrade):** امضا با همان کلید دائم معتبر با `versionCode = 14`.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.2.1.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.2.1/Dnic-GeoScan-v1.2.1.apk)**
          files: release/Dnic-GeoScan-v1.2.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
