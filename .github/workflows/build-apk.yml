name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.2.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.2.0-apk
          path: release/Dnic-GeoScan-v1.2.0.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.2.0
          name: "Dnic-GeoScan v1.2.0 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.2.0 - Geophysical Gradient Filter Engine & Instant Survey Release

            نسخه بزرگ ۱.۲.۰ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و قابلیت‌های اصلی این نسخه:
            - **موتور پیشرفته فیلترهای گرادیان ژئوفیزیک (Geophysical Gradient Filters):**
              - فیلتر **مشتق اول عمودی (1VD - First Vertical Derivative)** مبتنی بر عملگر لاپلاسی جهت آشکارسازی دقیق لبه‌ها، مرز ساختارها و خطوط گسل یا لوله‌ها.
              - فیلتر **سیگنال تحلیلی (Analytic Signal - AS)** برای حذف خطای انحراف دوقطبی مغناطیسی و متمرکزسازی بیشینه شدت دقیقاً روی مرکز هدف زیرسطحی.
            - **پیش‌بارگذاری آنی داده‌های مرجع ژئوفیزیکی در ورود به آنالیز محلی:** بارگذاری پیش‌فرض شبکه استاندارد ۱۰×۱۰ در شروع به کار جهت تضمین پایداری و محاسبه بلادرنگ خط مبنای زمین (Ground Zero Median).
            - **پشتیبانی سراسری از جداکننده‌های فاصله‌ای (Space-delimited Matrix & Triplet):** سازگاری کامل با خروجی‌های Surfer و دستگاه‌های مگنتومتر تجاری.
            - **تضمین قطعی حذف لنگر اسپلش و انتقال فوری به Compose:** استفاده از `setOnExitAnimationListener { it.remove() }` و `windowSplashScreenAnimationDuration = 100`.
            - **ناوبری ارگونومیک با سوییچرهای بالایی `LOCAL` و `REMOTE`:** جابه‌جایی فوری بدون نیاز به بازگشت به منوها.
            - **نمایش شفاف وضعیت عدم اتصال سخت‌افزار:** برچسب استاندارد `STATUS: DISCONNECTED • NO HARDWARE CONNECTED`.
            - **ارتقای یکپارچه درجا (In-place Upgrade):** امضا با همان کلید دائم معتبر با `versionCode = 13`.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.2.0.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.2.0/Dnic-GeoScan-v1.2.0.apk)**
          files: release/Dnic-GeoScan-v1.2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
