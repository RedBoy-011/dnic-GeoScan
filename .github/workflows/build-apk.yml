name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease --stacktrace || {
            echo "ERROR: assembleRelease failed. Dumping build reports:"
            find app/build/reports -type f -exec cat {} + || true
            exit 1
          }

      - name: Run Unit Tests
        run: ./gradlew testReleaseUnitTest --stacktrace
        continue-on-error: true

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Dnic-GeoScan-v1.8.1.apk

      - name: Verify Signed APK Integrity
        run: |
          echo "Verifying APK binary..."
          ls -lh release/Dnic-GeoScan-v1.8.1.apk
          test -f release/Dnic-GeoScan-v1.8.1.apk

      - name: Android Emulator Automated Installation & Launch Test
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            echo "=== Step 1: Installing Signed Release APK on Android 12 Emulator ==="
            adb install -r release/Dnic-GeoScan-v1.8.1.apk
            
            echo "=== Step 2: Launching MainActivity in Smartphone Mode ==="
            adb shell am start -W -n com.denic.geoscan/.MainActivity
            sleep 4
            
            echo "=== Step 3: Verifying Process Liveness (Confirming No Crash / No Black Screen) ==="
            APP_PID=$(adb shell pidof com.denic.geoscan)
            if [ -z "$APP_PID" ]; then
              echo "CRITICAL: App process is not running! Dumping logcat:"
              adb logcat -d | tail -n 120
              exit 1
            fi
            echo "SUCCESS: App is actively running with PID $APP_PID"
            
            echo "=== Step 4: Capturing Smartphone Screenshot ==="
            adb shell screencap -p /sdcard/emulator_phone.png
            adb pull /sdcard/emulator_phone.png release/emulator_phone.png || true
            
            echo "=== Step 5: Testing Tablet Mode Responsive Adaptation (1600x2560) ==="
            adb shell wm size 1600x2560
            sleep 3
            TABLET_PID=$(adb shell pidof com.denic.geoscan)
            if [ -z "$TABLET_PID" ]; then
              echo "CRITICAL: App crashed during tablet resolution switch!"
              adb logcat -d | tail -n 120
              exit 1
            fi
            echo "SUCCESS: App smoothly adapted to tablet resolution with PID $TABLET_PID"
            
            echo "=== Step 6: Capturing Tablet Screenshot ==="
            adb shell screencap -p /sdcard/emulator_tablet.png
            adb pull /sdcard/emulator_tablet.png release/emulator_tablet.png || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.8.1-apk
          path: release/Dnic-GeoScan-v1.8.1.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.8.1
          name: "Dnic-GeoScan v1.8.1 - V3D Survey Format Support & Bundled 10x10 Demo Datasets"
          body: |
            ## 📊 Dnic-GeoScan v1.8.1 - V3D Survey Format Support & Bundled 10x10 Demo Datasets

            نسخه رسمی ۱.۸.۱ اپلیکیشن تخصصی اسکنر ژئوفیزیک و گرادیومتر مغناطیسی **Dnic-GeoScan**.
            
            ### ✨ قابلیت‌های جدید و کلیدی این نسخه:
            - **پشتیبانی بومی از فرمت `.v3d` (Visualizer 3D):**
              - پارسر آفلاین داده‌ها اکنون قادر است فایل‌های `.v3d` با کامنت‌های نقطه ویرگول (`;`)، بخش‌های داده‌ای `[Header]` و `[Data]` و همچنین متادیتای اندازه ابعاد مشبک (`SamplesPerLine=10`) را بدون خطا بخواند و پردازش کند.
            - **تولید خودکار ماتریس از دنباله‌های تک‌مقداره:**
              - در صورت وجود ۱۰۰ مقدار پشت سر هم در یک فایل، الگوریتم به صورت خودکار ابعاد $10 \times 10$ را استخراج و مشبک را تشکیل می‌دهد.
            - **پیوست فایل‌های دمو استاندارد ۱۰ در ۱۰:**
              - فایل‌های دمو آزمایشی ۱۰×۱۰ با گرادیان ردیفی ۱۰۰۰ تا ۱۰۱۰ و ناهنجاری‌های فلزی (+µT) و حفرات (-µT) با فرمت‌های `.csv` و `.v3d` در قالب فایل‌های پیوست این ریلیز در دسترس هستند.

            ### 📥 فایل نصبی و فایل‌های دمو:
            - **[دانلود مستقیم Dnic-GeoScan-v1.8.1.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.8.1/Dnic-GeoScan-v1.8.1.apk)**
            - **[دانلود دمو CSV ۱۰×۱۰ (demo_10x10_anomaly.csv)](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.8.1/demo_10x10_anomaly.csv)**
            - **[دانلود دمو V3D ۱۰×۱۰ (demo_10x10_anomaly.v3d)](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.8.1/demo_10x10_anomaly.v3d)**
          files: |
            release/Dnic-GeoScan-v1.8.1.apk
            demo_scans/demo_10x10_anomaly.csv
            demo_scans/demo_10x10_anomaly.v3d
            release/emulator_phone.png
            release/emulator_tablet.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
