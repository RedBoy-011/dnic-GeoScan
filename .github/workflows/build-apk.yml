name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.1.6.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.1.6-apk
          path: release/Dnic-GeoScan-v1.1.6.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.1.6
          name: "Dnic-GeoScan v1.1.6 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.1.6 - Hardened Geophysical Telemetry & Instant Survey Release

            نسخه رسمی ۱.۱.۶ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و قابلیت‌های این نسخه:
            - **تقویت معماری ژئوفیزیک و استقلال ۱۰۰٪ آفلاین:** بهینه‌سازی کامل لایه ذخیره‌سازی، پردازش میانه (Median Ground Zero) و فیلتر هموارسازی دو مکعبی (Bicubic Spline Interpolation) بدون نیاز به سخت‌افزار یا اتصال شبکه.
            - **تست و بارگذاری سریع سه تراکم شبکه‌ای (۱۰×۱۰، ۲۰×۲۰ و ۳۰×۳۰):** دسترسی مستقیم از هاب به شبکه‌های متنوع میدانی با ناوبری هوشمند یکپارچه.
            - **تضمین قطعی خروج از اسپلش‌اسکرین (`setKeepOnScreenCondition { false }`):** خروج صفر میلی‌ثانیه‌ای و روان بدون کوچک‌ترین گیر روی لوگو.
            - **نمایش شفاف وضعیت عدم اتصال:** برچسب استاندارد `STATUS: DISCONNECTED • NO HARDWARE CONNECTED`.
            - **ارتقای یکپارچه درجا (In-place Upgrade):** امضا با همان کلید دائم معتبر با `versionCode = 10` جهت آپدیت روی نسخه‌های قبل.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.1.6.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.1.6/Dnic-GeoScan-v1.1.6.apk)**
          files: release/Dnic-GeoScan-v1.1.6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
