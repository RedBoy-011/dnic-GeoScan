name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.0.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.0.1-apk
          path: release/Dnic-GeoScan-v1.0.1.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.0.1
          name: "Dnic-GeoScan v1.0.1 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.0.1

            نسخه رسمی و تایید شده اپلیکیشن اسکنر ژئوفیزیک و تحلیل داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات این نسخه:
            - ارتقای نسخه به ۱.۰.۱ (versionCode 2) جهت بروزرسانی مستقیم روی نسخه قبلی بدون نیاز به حذف برنامه
            - امضای دائمی با کلید اختصاصی پایدار (Persistent Release Keystore) جهت رفع خطای نصب و تداخل امضا
            - یکپارچه‌سازی نام برنامه با نام پروژه: **Dnic-GeoScan**
            - ایمن‌سازی کامل چرخه حیات و هندلینگ پیشرفته خطاها

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.0.1.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.0.1/Dnic-GeoScan-v1.0.1.apk)**
          files: release/Dnic-GeoScan-v1.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
