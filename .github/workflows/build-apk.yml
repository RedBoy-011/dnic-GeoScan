name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.0.2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.0.2-apk
          path: release/Dnic-GeoScan-v1.0.2.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.0.2
          name: "Dnic-GeoScan v1.0.2 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.0.2

            نسخه رسمی و بهینه‌سازی‌شده اپلیکیشن اسکنر ژئوفیزیک و تحلیل داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و اصلاحات این نسخه:
            - **حل قطعی توقف روی لوگو (Fix Splash Screen Hang):** لود غیرهمزمان و تاخیری ماژول ۳ بعدی WebView به همراه نمایش آنی و بدون بلاک رابط کاربری اصلی.
            - **مدیریت استثناهای بومی (Native Error Fallback):** حذف خطای بلاک شدن فرآیند اجرای سیستم‌عامل و نمایش فوری گزارش تشخیصی در صورت بروز هرگونه خطای نادر.
            - **سازگاری ۱۰۰٪ با تبلت‌ها و گوشی‌های سامسونگ:** تصحیح لایه‌بندی GPU و رندر ایمن بدون وابستگی سخت‌افزاری به شتاب‌دهنده گرافیکی ناسازگار.
            - **ارتقای یکپارچه درون‌برنامه‌ای:** امکان نصب و بروزرسانی مستقیم بدون نیاز به حذف برنامه قبلی (Signed with persistent key, versionCode 3).

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.0.2.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.0.2/Dnic-GeoScan-v1.0.2.apk)**
          files: release/Dnic-GeoScan-v1.0.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
