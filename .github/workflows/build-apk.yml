name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.1.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.1.1-apk
          path: release/Dnic-GeoScan-v1.1.1.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.1.1
          name: "Dnic-GeoScan v1.1.1 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.1.1 - Offline Grids & Instant Inspection Release

            نسخه رسمی ۱.۱.۱ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و قابلیت‌های این نسخه:
            - **شبیه‌ساز آفلاین فوری شبکه‌های ۱۰×۱۰ و ۲۰×۲۰:** اضافه شدن دکمه‌های تست سریع `⚡ 10×10 Grid` و `⚡ 20×20 Grid` جهت ارزیابی آنی گرادیان مغناطیسی، نرمال‌سازی میانه (Median Ground Zero)، و رندر سه‌بعدی سطحی بدون نیاز به فایل خارجی یا اتصال سخت‌افزار.
            - **رفع قطعی گیر کردن روی اسپلش (Official Android 12+ SplashScreen API):** انتقال روان و بدون وقفه با کتابخانه استاندارد `androidx.core:core-splashscreen:1.0.1`.
            - **صفحه فرود هاب عملیاتی (Landing Mission Hub):** طراحی مدرن کارت‌های دسترسی با اولویت تام حالت Local Analysis (آفلاین ۱۰۰٪).
            - **نمایش شفاف وضعیت عدم اتصال:** برچسب واضح و غیرمسدودکننده `STATUS: DISCONNECTED • NO HARDWARE CONNECTED`.
            - **ارتقای یکپارچه درجا (In-place Update):** امضا با کلید اختصاصی دائمی با `versionCode = 5` بدون نیاز به لغو نصب نسخه‌های قبل.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.1.1.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.1.1/Dnic-GeoScan-v1.1.1.apk)**
          files: release/Dnic-GeoScan-v1.1.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
