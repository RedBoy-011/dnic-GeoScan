name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.3.7.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.3.7-apk
          path: release/Dnic-GeoScan-v1.3.7.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.3.7
          name: "Dnic-GeoScan v1.3.7 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.3.7 - Persistent In-Screen Grid Presets & High-Speed Offline Pipeline
            
            نسخه رسمی ۱.۳.۷ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و قابلیت‌های اصلی این نسخه:
            - **انتخابگر دائمی شبکه‌های میدانی در صفحه تحلیل محلی (Persistent In-Screen Grid Presets):**
              - امکان جابه‌جایی آنی با ۱ لمس میان شبکه‌های ۵×۵، ۱۰×۱۰، ۲۰×۲۰ و ۳۰×۳۰ بدون نیاز به پاک کردن فایل فعلی، در هر دو حالت گوشی و تبلت.
              - نمایش نشانگر وضعیت فعال بودن شبکه به همراه ابعاد دقیق نقطه و تفکیک خودکار فایل‌های نمونه و فایل‌های دیسک.
            - **رفع نهایی فریز اسپلش با خروج تضمینی در اندروید ۱۲+:**
              - لیسنر اختصاصی خروج اسپلش `setOnExitAnimationListener` با فراخوانی مستقیم `remove()`، حذف سریع لوگوی نئونی و انتقال روان به کامپوزیتور گرافیکی.
            - **بنر بدون انسداد وضعیت عدم اتصال سخت‌افزار (Disconnected Status):**
              - اعلام وضعیت `STATUS: DISCONNECTED • NO HARDWARE CONNECTED` به همراه میانبرهای مستقیم به تحلیل آفلاین یا اتصال سنسور.
            - **ارتقای یکپارچه درجا (In-place Upgrade):** امضا با همان کلید دائم معتبر با `versionCode = 23`.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.3.7.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.3.7/Dnic-GeoScan-v1.3.7.apk)**
          files: release/Dnic-GeoScan-v1.3.7.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
