name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease --stacktrace || {
            echo "ERROR: assembleRelease failed. Dumping build reports:"
            find app/build/reports -type f -exec cat {} + || true
            exit 1
          }

      - name: Run Unit Tests
        run: ./gradlew testReleaseUnitTest --stacktrace
        continue-on-error: true

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Dnic-GeoScan-v1.5.1.apk

      - name: Verify Signed APK Integrity
        run: |
          echo "Verifying APK binary..."
          ls -lh release/Dnic-GeoScan-v1.5.1.apk
          test -f release/Dnic-GeoScan-v1.5.1.apk

      - name: Android Emulator Automated Installation & Launch Test
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            echo "=== Step 1: Installing Signed Release APK on Android 12 Emulator ==="
            adb install -r release/Dnic-GeoScan-v1.5.1.apk
            
            echo "=== Step 2: Launching MainActivity in Smartphone Mode ==="
            adb shell am start -W -n com.denic.geoscan/.MainActivity
            sleep 4
            
            echo "=== Step 3: Verifying Process Liveness (Confirming No Crash / No Black Screen) ==="
            APP_PID=$(adb shell pidof com.denic.geoscan)
            if [ -z "$APP_PID" ]; then
              echo "CRITICAL: App process is not running! Dumping logcat:"
              adb logcat -d | tail -n 120
              exit 1
            fi
            echo "SUCCESS: App is actively running with PID $APP_PID"
            
            echo "=== Step 4: Capturing Smartphone Screenshot ==="
            adb shell screencap -p /sdcard/emulator_phone.png
            adb pull /sdcard/emulator_phone.png release/emulator_phone.png || true
            
            echo "=== Step 5: Testing Tablet Mode Responsive Adaptation (1600x2560) ==="
            adb shell wm size 1600x2560
            sleep 3
            TABLET_PID=$(adb shell pidof com.denic.geoscan)
            if [ -z "$TABLET_PID" ]; then
              echo "CRITICAL: App crashed during tablet resolution switch!"
              adb logcat -d | tail -n 120
              exit 1
            fi
            echo "SUCCESS: App smoothly adapted to tablet resolution with PID $TABLET_PID"
            
            echo "=== Step 6: Capturing Tablet Screenshot ==="
            adb shell screencap -p /sdcard/emulator_tablet.png
            adb pull /sdcard/emulator_tablet.png release/emulator_tablet.png || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.5.1-apk
          path: release/Dnic-GeoScan-v1.5.1.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.5.1
          name: "Dnic-GeoScan v1.5.1 - Anti-Crash Shield & Samsung One UI 6 Stability"
          body: |
            ## 📱 Dnic-GeoScan v1.5.1 - Anti-Crash Diagnostic Shield & Samsung One UI 6 Stability
            
            نسخه رسمی ۱.۵.۱ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و اصلاحات این نسخه:
            - **سیستم ضد فورس‌کلوز و جعبه سیاه نجات‌بخش (Anti-Crash Diagnostic Shield):**
              - پیاده‌سازی کلاس سفارشی `DenicApplication` با متد ره‌گیری خطاهای پیش‌بینی نشده (UncaughtExceptionHandler).
              - در صورت بروز هرگونه خطای راه‌اندازی، برنامه فورس‌کلوز یا بسته نمی‌شود؛ بلکه اکتیویتی بومی ایزوله `DiagnosticActivity` باز شده، مشخصات دقیق دستگاه و StackTrace را نشان می‌دهد و دکمه کپی فوری گزارش خطا را در اختیار کاربر می‌گذارد.
              - ذخیره خودکار متن کامل خطا در فایل `crash_log.txt` در پوشه اختصاصی برنامه (`/sdcard/Android/data/com.denic.geoscan/files/`).
            - **سازگاری ۱۰۰٪ با سامسونگ گلکسی S24 Ultra و اندروید ۱۴ (One UI 6.1 Stability):**
              - رفع تداخل تم‌های XML با ویژگی `enableEdgeToEdge()` در اندروید ۱۴ و حذف ویژگی‌های قدیمی استاتوس‌بار که در رام سامسونگ موجب فورس‌کلوز می‌شدند.
              - قرار دادن متد بومی `installSplashScreen()` در بلوک ایمن محافظتی جهت جلوگیری از هرگونه خطای لودینگ لایه پنجره WindowManager.
            - **طراحی کاملاً رسپانسیو تطبیقی برای گوشی‌های هوشمند و تبلت‌ها:**
              - چیدمان دوسطونه در تبلت‌ها و داک ناوبری شناور کپسولی در مرکز پایین صفحه (`widthIn(max = 520.dp)`).
            - **تست کامل در شبیه‌ساز اندروید گیت‌هاب:**
              - نصب و اعتبارسنجی خودکار از طریق `adb install` و `am start` در پایپ‌لاین CI.
            - **ارتقای یکپارچه درجا (In-place Upgrade):** امضا با همان کلید دائم معتبر با `versionCode = 30`.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.5.1.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.5.1/Dnic-GeoScan-v1.5.1.apk)**
          files: |
            release/Dnic-GeoScan-v1.5.1.apk
            release/emulator_phone.png
            release/emulator_tablet.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
