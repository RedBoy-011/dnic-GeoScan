name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.1.7.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.1.7-apk
          path: release/Dnic-GeoScan-v1.1.7.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.1.7
          name: "Dnic-GeoScan v1.1.7 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.1.7 - Zero-Lag Splash, Direct Mode Switch & WebGL Safe Fallback

            نسخه رسمی ۱.۱.۷ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و قابلیت‌های این نسخه:
            - **حذف قطعی انیمیشن لنگر انداختن اسپلش (`setOnExitAnimationListener { it.remove() }`):** خروج بدون وقفه از Splash Screen و انتقال آنی به فریم‌های Jetpack Compose.
            - **سوییچر دسترسی سریع هدر (Persistent Quick-Switch Mode Pills):** دکمه‌های ناوبری فوری یک‌لمسی `LOCAL` و `REMOTE` در بالای تمام صفحات برای جابه‌جایی آنی میان تحلیل آفلاین و اسکن آنلاین.
            - **شتاب‌دهنده سخت‌افزاری و فال‌بک امن WebGL (Safe 2D Fallback):** بازگشت خودکار به هیت‌مپ دوبعدی در صورت بروز هرگونه ناسازگاری یا محدودیت در شیدرهای سه‌بعدی WebGL.
            - **اولویت کامل به تحلیل آفلاین (Local Analysis):** پردازش مستقل شبکه‌های ۱۰×۱۰، ۲۰×۲۰ و ۳۰×۳۰، نرمال‌سازی میانه (Median Ground Zero) و درونیابی دو مکعبی.
            - **نمایش شفاف عدم اتصال سخت‌افزار:** نمایش غیراختلالی وضعیت `STATUS: DISCONNECTED • NO HARDWARE CONNECTED`.
            - **ارتقای یکپارچه درجا (In-place Upgrade):** امضا با کلید یکتا و دائمی با `versionCode = 11`.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.1.7.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.1.7/Dnic-GeoScan-v1.1.7.apk)**
          files: release/Dnic-GeoScan-v1.1.7.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
