name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.1.8.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.1.8-apk
          path: release/Dnic-GeoScan-v1.1.8.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.1.8
          name: "Dnic-GeoScan v1.1.8 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.1.8 - Universal Delimiter Parser & Preloaded Geophysical Baseline

            نسخه رسمی ۱.۱.۸ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و قابلیت‌های این نسخه:
            - **پیش‌بارگذاری آنی داده‌های مرجع ژئوفیزیکی در ورود به آنالیز محلی:** بارگذاری پیش‌فرض شبکه استاندارد ۱۰×۱۰ در شروع به کار جهت تضمین پایداری، تست بدون نیاز به فایل و محاسبه بلادرنگ خط مبنای زمین (Ground Zero Median).
            - **پشتیبانی سراسری از جداکننده‌های فاصله‌ای (Space-delimited Matrix & Triplet):** ارتقای پارسر محلی برای خواندن فایل‌های متنی خروجی Surfer و مگنتومترهای تجاری که از Space یا Tab به عنوان جداکننده استفاده می‌کنند.
            - **تنظیم قطعی مدت زمان اسپلش در تم سیستمی (`windowSplashScreenAnimationDuration = 100`):** اطلاع‌رسانی صریح به WindowManager جهت عدم توقف روی انیمیشن‌های سیستم‌عامل.
            - **ناوبری ارگونومیک با سوییچرهای بالایی `LOCAL` و `REMOTE`:** جابه‌جایی فوری بدون نیاز به بازگشت به منوها.
            - **نمایش شفاف وضعیت عدم اتصال سخت‌افزار:** برچسب استاندارد `STATUS: DISCONNECTED • NO HARDWARE CONNECTED`.
            - **ارتقای یکپارچه درجا (In-place Upgrade):** امضا با کلید دائم معتبر با `versionCode = 12`.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.1.8.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.1.8/Dnic-GeoScan-v1.1.8.apk)**
          files: release/Dnic-GeoScan-v1.1.8.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
