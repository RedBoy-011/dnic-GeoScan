name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.3.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.3.0-apk
          path: release/Dnic-GeoScan-v1.3.0.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.3.0
          name: "Dnic-GeoScan v1.3.0 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.3.0 - Geophysical Depth Estimation Engine & 2D Profile

            نسخه رسمی ۱.۳.۰ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و قابلیت‌های اصلی این نسخه:
            - **موتور تخمین ژئوفیزیکی عمق هدف (Geophysical Depth Estimation Engine):**
              - پیاده‌سازی قانون علمی نیم‌عرض ناهنجاری (Half-Width Rule - Telford & Breiner standard) جهت تخمین عمق دقیق دفن اهداف فلزی یا حفرات.
              - امکان انتخاب فاصله فیزیکی ایستگاه‌های برداشت (Station Spacing: 0.5m, 1.0m, 2.0m).
              - نمایش هوشمند عمق تخمینی به متر، نوع تارگت (Ferrous Metal vs Void/Cavity) و ضریب اطمینان (Confidence Score).
            - **انتقال بدون وقفه و آنی از اسپلش به Compose:** رفع کامل مسدودی لایه اسپلش و اجرای سریع بر روی تمامی رام‌های اندروید ۱۲ به بالا.
            - **ورود مستقیم و پرسرعت به Mission Control Hub:** اولویت‌دهی به کار با فایل‌های محلی آفلاین با دکمه‌های مستقیم پیش‌نمایش شبکه‌های ۱۰×۱۰، ۲۰×۲۰ و ۳۰×۳۰.
            - **نمایش شفاف و تعاملی بنر عدم اتصال سخت‌افزار (`STATUS: DISCONNECTED • NO HARDWARE CONNECTED`).**
            - **ماژول ترانسکت و مقطع دوبعدی عمق (2D Transect Cross-Section Engine).**
            - **فیلترهای ژئوفیزیکی مشتق اول عمودی (1VD) و سیگنال تحلیلی (AS).**
            - **ارتقای یکپارچه درجا (In-place Upgrade):** امضا با همان کلید دائم معتبر با `versionCode = 16`.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.3.0.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.3.0/Dnic-GeoScan-v1.3.0.apk)**
          files: release/Dnic-GeoScan-v1.3.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
