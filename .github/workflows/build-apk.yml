name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.3.4.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.3.4-apk
          path: release/Dnic-GeoScan-v1.3.4.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.3.4
          name: "Dnic-GeoScan v1.3.4 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.3.4 - Interactive Disconnected Card & Instant Local Access

            نسخه رسمی ۱.۳.۴ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و قابلیت‌های اصلی این نسخه:
            - **بنر تعاملی وضعیت عدم اتصال با میانبر مستقیم (Interactive Disconnected Banner):**
              - افزودن دو دکمه عمل مستقیم در کارت وضعیت سخت‌افزار (`Use Local Mode` به رنگ سبز و `Connect Sensor` به رنگ فیروزه‌ای) جهت هدایت آنی به تحلیل آفلاین بدون نیاز به جستجو در منوها.
            - **رفع نهایی فریز اسپلش و اجرای فوق‌سریع در اندروید ۱۲ به بالا:**
              - حذف هرگونه وابستگی یا انیمیشن مسدودکننده و خروج میلی‌ثانیه‌ای از آیکون شش‌ضلعی به صفحه اصلی.
            - **پشتیبانی کامل و مستقل از تحلیل آفلاین فایل‌ها و شبکه‌های میدانی:**
              - بارگذاری و پردازش سریع شبکه‌های ۵×۵، ۱۰×۱۰، ۲۰×۲۰ و ۳۰×۳۰ و فایل‌های CSV/TXT با نرمال‌سازی میانه (Median Ground Zero).
            - **ارتقای یکپارچه درجا (In-place Upgrade):** امضا با همان کلید دائم معتبر با `versionCode = 20`.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.3.4.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.3.4/Dnic-GeoScan-v1.3.4.apk)**
          files: release/Dnic-GeoScan-v1.3.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
