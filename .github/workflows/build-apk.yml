name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.3.5.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.3.5-apk
          path: release/Dnic-GeoScan-v1.3.5.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.3.5
          name: "Dnic-GeoScan v1.3.5 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.3.5 - Configurable Startup & Instant Offline Launch
            
            نسخه رسمی ۱.۳.۵ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و قابلیت‌های اصلی این نسخه:
            - **قابلیت تعیین صفحه پیش‌فرض شروع (Configurable startDestination):**
              - امکان ورود مستقیم به حالت تحلیل آفلاین محلی (`Local Analysis`) بلافاصله پس از باز شدن برنامه بدون نیاز به عبور از هاب اصلی.
              - ذخیره‌سازی دائمی ترجیحات اپراتور میدانی در `SharedPreferences` با کلید `start_screen`.
            - **چیپ تعاملی تنظیم حالت بوت در سربرگ (Boot Mode Toggle):**
              - افزودن نشانگر وضعیت و دکمه سوییچ (`Boot: Local` / `Boot: Hub`) در بالای صفحه اصلی هاب جهت تغییر سریع رفتار لود اولیه برنامه.
            - **حذف قطعی هرگونه تأخیر اسپلش در اندروید ۱۲+:**
              - باز شدن بی‌درنگ و بدون قفل شدن روی آیکون نئونی، هماهنگ با تسریع رندرینگ Compose.
            - **ارتقای یکپارچه درجا (In-place Upgrade):** امضا با کلید دائم معتبر با `versionCode = 21` و سازگاری کامل روی نسخه‌های قبلی.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.3.5.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.3.5/Dnic-GeoScan-v1.3.5.apk)**
          files: release/Dnic-GeoScan-v1.3.5.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
