name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.2.2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.2.2-apk
          path: release/Dnic-GeoScan-v1.2.2.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.2.2
          name: "Dnic-GeoScan v1.2.2 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.2.2 - Instant Compose Launch & Zero-Lag Splash Lifecycle

            نسخه رسمی ۱.۲.۲ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و بهینه‌سازی‌های این نسخه:
            - **انتقال بدون وقفه و آنی از اسپلش به Compose:** حذف مانع `setOnExitAnimationListener` که بر روی برخی رام‌ها و دستگاه‌ها (نظیر شیائومی، سامسونگ و اندروید ۱۲ به بالا) مانع از دیسمیس خودکار ویندوز اسپلش می‌شد.
            - **ورود مستقیم و پرسرعت به Mission Control Hub:** اولویت‌دهی به کار با فایل‌های محلی آفلاین با دکمه‌های مستقیم پیش‌نمایش شبکه‌های ۱۰×۱۰، ۲۰×۲۰ و ۳۰×۳۰.
            - **نمایش شفاف و تعاملی بنر عدم اتصال سخت‌افزار (`STATUS: DISCONNECTED • NO HARDWARE CONNECTED`):** هدایت سریع به صفحه اسکن با کلیک روی بنر یا قرص‌های سوییچ فوری.
            - **ماژول ترانسکت و مقطع دوبعدی عمق (2D Transect Cross-Section Engine):** اسلایدر متحرک پیمایش روی خطوط X و Y با خط مبنای ژئوفیزیکی Ground Zero.
            - **فیلترهای ژئوفیزیکی مشتق اول عمودی (1VD) و سیگنال تحلیلی (AS).**
            - **ارتقای یکپارچه درجا (In-place Upgrade):** امضا با همان کلید دائم معتبر با `versionCode = 15`.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.2.2.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.2.2/Dnic-GeoScan-v1.2.2.apk)**
          files: release/Dnic-GeoScan-v1.2.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
