name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.3.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.3.1-apk
          path: release/Dnic-GeoScan-v1.3.1.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.3.1
          name: "Dnic-GeoScan v1.3.1 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.3.1 - Offline CSV Export & Direct Local Switcher

            نسخه رسمی ۱.۳.۱ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و قابلیت‌های اصلی این نسخه:
            - **خروجی گرفتن و ذخیره آفلاین داده‌ها با فیلترها (Processed CSV Export):**
              - دکمه اختصاصی `Export CSV` در کارت منبع داده برای اکسپورت تمام داده‌های فیلترشده (نرمال‌شده، مشتق اول عمودی 1VD، سیگنال تحلیلی AS) در پوشه استاندارد Documents/denic-GeoScan.
              - نمایش وضعیت بلادرنگ ذخیره‌سازی، اعلان سبز رنگ مسیر فایل و امکان بستن آسان پیام.
            - **دسترسی سریع و میانبر آفلاین از صفحه اسکن ریموت (Direct Offline Switcher):**
              - افزودن دکمه تعاملی سبز نئونی `Offline? Switch to Local Analysis Mode` به بخش وضعیت سخت‌افزار هنگام قطع اتصال، جهت هدایت فوری اپراتور به تحلیل فایل‌های محلی.
            - **بهینه‌سازی کارت‌های ابزار و مقیاس‌پذیری تبلت و موبایل:** چیدمان فشرده‌تر دکمه‌های هموارسازی (Bicubic Smoothing) و ذخیره‌سازی داده.
            - **ارتقای یکپارچه درجا (In-place Upgrade):** امضا با همان کلید دائم معتبر با `versionCode = 17`.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.3.1.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.3.1/Dnic-GeoScan-v1.3.1.apk)**
          files: release/Dnic-GeoScan-v1.3.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
