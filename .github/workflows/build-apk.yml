name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Signed Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle_build.log

      - name: Debug Output on Build Failure
        if: failure()
        run: |
          echo "## ❌ Gradle Build Failure Diagnostic" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle_build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "=== Printing annotations for API ==="
          grep -E "e: |> Task |FAILURE:|What went wrong|Caused by:" gradle_build.log | tail -n 25 | while IFS= read -r line; do
            echo "::error title=FailureDetail::$line"
          done
          tail -n 35 gradle_build.log | while IFS= read -r line; do
            echo "::notice title=GradleOutput::$line"
          done

      - name: Upload Failure Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-log
          path: gradle_build.log

      - name: Run Unit Tests
        run: ./gradlew testReleaseUnitTest --stacktrace
        continue-on-error: true

      - name: Prepare Release APK
        run: |
          mkdir -p release
          echo "=== Locating built APK in app/build/outputs/apk ==="
          find app/build/outputs/apk -type f || true
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Checking entire app/build for any APK:"
            find app/build -name "*.apk" || true
            APK_FILE=$(find app/build -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found anywhere in app/build!"
            exit 1
          fi
          echo "SUCCESS: Found APK at $APK_FILE"
          cp "$APK_FILE" release/Dnic-GeoScan-v2.2.0.apk

      - name: Verify Signed APK Integrity
        run: |
          echo "Verifying APK binary..."
          ls -lh release/Dnic-GeoScan-v2.2.0.apk
          test -f release/Dnic-GeoScan-v2.2.0.apk

      - name: Android Emulator Automated Installation & Launch Test
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            echo "=== Step 1: Installing Signed Release APK on Android 12 Emulator ==="
            adb install -r release/Dnic-GeoScan-v2.2.0.apk
            
            echo "=== Step 2: Launching MainActivity in Smartphone Mode ==="
            adb shell am start -W -n com.denic.geoscan/.MainActivity
            sleep 4
            
            echo "=== Step 3: Verifying Process Liveness (Confirming No Crash / No Black Screen) ==="
            APP_PID=$(adb shell pidof com.denic.geoscan)
            if [ -z "$APP_PID" ]; then
              echo "CRITICAL: App process is not running! Dumping logcat:"
              adb logcat -d | tail -n 120
              exit 1
            fi
            echo "SUCCESS: App is actively running with PID $APP_PID"
            
            echo "=== Step 4: Capturing Smartphone Screenshot ==="
            adb shell screencap -p /sdcard/emulator_phone.png
            adb pull /sdcard/emulator_phone.png release/emulator_phone.png || true
            
            echo "=== Step 5: Testing Tablet Mode Responsive Adaptation (1600x2560) ==="
            adb shell wm size 1600x2560
            sleep 3
            TABLET_PID=$(adb shell pidof com.denic.geoscan)
            if [ -z "$TABLET_PID" ]; then
              echo "CRITICAL: App crashed during tablet resolution switch!"
              adb logcat -d | tail -n 120
              exit 1
            fi
            echo "SUCCESS: App smoothly adapted to tablet resolution with PID $TABLET_PID"
            
            echo "=== Step 6: Capturing Tablet Screenshot ==="
            adb shell screencap -p /sdcard/emulator_tablet.png
            adb pull /sdcard/emulator_tablet.png release/emulator_tablet.png || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v2.2.0-apk
          path: release/Dnic-GeoScan-v2.2.0.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v2.2.0
          name: "Dnic-GeoScan v2.2.0 - Fullscreen 3D/2D Visualizer with Tablet Support, Snapshot Export & Dev Mode"
          body: |
            ## 🌍 Dnic-GeoScan v2.2.0 - Fullscreen Visualizer, Tablet Adaptation & Snapshot Export

            نسخه ارتقایافته رسمی ۲.۲.۰ اپلیکیشن تخصصی اسکنر ژئوفیزیک و گرادیومتر مغناطیسی **Dnic-GeoScan**.
            
            ### ✨ تغییرات و قابلیت‌های جدید این نسخه (v2.2.0):
            1. **حالت تمام‌صفحه (Fullscreen Visualizer) برای پلات ۳بعدی و نقشه حرارتی ۲بعدی:**
               - اضافه شدن دکمه بزرگ‌نمایی/تمام‌صفحه به هدر نمایشگر.
               - انطباق ۱۰۰٪ با ابعاد تبلت‌ها و نمایشگرهای عریض (مانند Samsung Galaxy Tab، رفرش ریت بالا، و رزولوشن‌های 1600x2560).
               - دکمه برجسته «خروج از تمام‌صفحه» (Exit Fullscreen) و پشتیبانی از دکمه فیزیکی یا ژست حرکتی Back گوشی و تبلت.
               - امکان سوئیچ آنی بین پلات ۳بعدی و نقشه ۲بعدی مستقیماً داخل حالت تمام‌صفحه بدون نیاز به خروج.
            2. **خروجی تصویر با کیفیت بالا (High-Resolution Snapshot Export & Share):**
               - امکان دریافت خروجی باکیفیت از سطح سه‌بعدی و دوبعدی زمین با لمس دکمه «خروجی تصویر».
               - ذخیره خودکار در گالری و پوشه تصاویر (`Pictures/GeoScan`) در اندروید ۱۰ به بالا.
               - باز شدن آنی پنجره اشتراک‌گذاری سیستمی (Share Sheet) جهت ارسال تصویر به تلگرام، واتساپ، ایمیل یا پرینت.
            3. **حالت توسعه سریع (License Dev Mode):**
               - موقتاً مانع فعال‌سازی غیرفعال شده (`IS_LICENSE_ENFORCEMENT_ENABLED = false`) تا برنامه‌نویس و تسترها بتوانند بدون نیاز به وارد کردن لایسنس به تمامی بخش‌های برنامه دسترسی داشته باشند.
               - ساختار رمزنگاری و شناسه سخت‌افزاری کاملاً حفظ شده و مستندات کامل آن در پوشه `docs/licensing/` تدوین گردیده است.
            4. **تمامی قابلیت‌های پایدار نسخه ۲.۱.۰ و ۲.۰.۱:**
               - موتور ماتریسی دکارتی R surface3d با کالیبراسیون کامل رنگ‌ها و نرمال‌سازی پیوسته.
               - شتاب‌دهنده سخت‌افزاری WebGL همراه با موتور ذخیره خودکار سشن‌های بلوتوثی.

            ### 📥 فایل نصبی و فایل‌های دمو:
            - **[دانلود مستقیم Dnic-GeoScan-v2.2.0.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v2.2.0/Dnic-GeoScan-v2.2.0.apk)**
            - **[دانلود دمو معدن چندعمقی CSV (demo_mine_multidepth.csv)](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v2.2.0/demo_mine_multidepth.csv)**
            - **[دانلود دمو معدن چندعمقی V3D (demo_mine_multidepth.v3d)](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v2.2.0/demo_mine_multidepth.v3d)**
            - **[دانلود دمو CSV ۱۰×۱۰ (demo_10x10_anomaly.csv)](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v2.2.0/demo_10x10_anomaly.csv)**
            - **[دانلود دمو V3D ۱۰×۱۰ (demo_10x10_anomaly.v3d)](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v2.2.0/demo_10x10_anomaly.v3d)**
          files: |
            release/Dnic-GeoScan-v2.2.0.apk
            demo_scans/demo_mine_multidepth.csv
            demo_scans/demo_mine_multidepth.v3d
            demo_scans/demo_10x10_anomaly.csv
            demo_scans/demo_10x10_anomaly.v3d
            release/emulator_phone.png
            release/emulator_tablet.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
