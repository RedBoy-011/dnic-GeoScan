name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.1.2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.1.2-apk
          path: release/Dnic-GeoScan-v1.1.2.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.1.2
          name: "Dnic-GeoScan v1.1.2 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.1.2 - Instant Launch & Hardened Offline Survey Release

            نسخه رسمی ۱.۱.۲ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و قابلیت‌های این نسخه:
            - **تضمین قطعی و آنی بسته‌شدن اسپلش‌اسکرین (`setKeepOnScreenCondition { false }`):** اعمال دستور قطعی خروج از اسپلش به Window Manager در اندروید ۱۲+ بدون کوچک‌ترین تاخیر یا گیر کردن روی لوگو حتی در رام‌های سفارشی تبلت‌ها.
            - **شبیه‌ساز و تست فوری شبکه‌های ۱۰×۱۰ و ۲۰×۲۰:** دسترسی سریع به تولید گرادیان‌های مغناطیسی با اهداف فرومغناطیسی و حفرات در حالت آفلاین.
            - **صفحه فرود هاب عملیاتی (Landing Mission Hub):** تفکیک کامل و سریع بین تحلیل محلی بدون سخت‌افزار (Local Analysis) و مانیتورینگ بلادرنگ (Remote Scan).
            - **اعلام شفاف و غیرمسدودکننده وضعیت قطعی سخت‌افزار:** نمایش `STATUS: DISCONNECTED • NO HARDWARE CONNECTED` به همراه وضعیت آماده‌باش SPP.
            - **بروزرسانی مستقیم و درجا (In-place Upgrade):** امضا با کلید اختصاصی دائمی با `versionCode = 6` بدون نیاز به حذف نسخه‌های قبل.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.1.2.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.1.2/Dnic-GeoScan-v1.1.2.apk)**
          files: release/Dnic-GeoScan-v1.1.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
