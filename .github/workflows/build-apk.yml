name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.1.4.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.1.4-apk
          path: release/Dnic-GeoScan-v1.1.4.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.1.4
          name: "Dnic-GeoScan v1.1.4 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.1.4 - Deep-Link Grid Survey & Dynamic Navigation Release

            نسخه رسمی ۱.۱.۴ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و قابلیت‌های این نسخه:
            - **ناوبری دیپ‌لینک هوشمند برای شبکه‌های ۱۰×۱۰ و ۲۰×۲۰:** با فشردن دکمه‌های دمو در هاب اصلی، صفحه تحلیل محلی بلافاصله داده‌های شبکه انتخاب‌شده را تولید و در کمتر از چند میلی‌ثانیه به موتور سه‌بعدی ECharts تحویل می‌دهد (بدون نیاز به حتی ۱ کلیک اضافی).
            - **پشتیبانی کامل و همگام نوار ناوبری پایینی (Active Bottom Bar State):** همگام‌سازی کامل وضعیت تب انتخابی در روت‌های پارامتریک با جلوه شیشه‌ای مدرن.
            - **تضمین قطعی خروج از اسپلش‌اسکرین (`setKeepOnScreenCondition { false }`):** خروج صفر میلی‌ثانیه‌ای و روان بدون کوچک‌ترین گیر روی لوگو.
            - **نمایش شفاف وضعیت عدم اتصال:** برچسب واضح و خوانای `STATUS: DISCONNECTED • NO HARDWARE CONNECTED`.
            - **ارتقای یکپارچه درجا (In-place Upgrade):** امضا با همان کلید دائم معتبر با `versionCode = 8` جهت آپدیت روی نسخه‌های قبل.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.1.4.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.1.4/Dnic-GeoScan-v1.1.4.apk)**
          files: release/Dnic-GeoScan-v1.1.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
