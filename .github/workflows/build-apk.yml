name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.3.2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.3.2-apk
          path: release/Dnic-GeoScan-v1.3.2.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.3.2
          name: "Dnic-GeoScan v1.3.2 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.3.2 - Instant Android 12+ Splash Dismissal & Prominent Disconnected Banner

            نسخه رسمی ۱.۳.۲ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و قابلیت‌های اصلی این نسخه:
            - **تضمین خروج آنی و بدون وقفه از Splash Screen در اندروید ۱۲ به بالا:**
              - فراخوانی صریح `setKeepOnScreenCondition { false }` و مقداردهی مستقیم پوسته `Theme.DenicGeoScan` به منظور جلوگیری از هرگونه تعلیق لایه اسپلش سیستم بر روی رام‌های سفارشی (سامسونگ OneUI، شیائومی HyperOS/MIUI).
            - **نمایش برجسته و حرفه‌ای وضعیت «عدم اتصال» (`STATUS: DISCONNECTED • NO HARDWARE CONNECTED`):**
              - بازطراحی بنر وضعیت سخت‌افزار در هاب مأموریت و صفحه ریموت جهت نمایش صریح عدم وجود سنسور با رنگ نارنجی هشدار و متن استاندارد.
            - **اولویت‌بخشی کامل به حالت Local Analysis:**
              - اجرای فوری و بدون وابستگی به بلوتوث برای شبکه‌های ۱۰×۱۰، ۲۰×۲۰، ۳۰×۳۰ و فایل‌های ورودی CSV/TXT با نرمال‌سازی میانه (Median Ground Zero) و درون‌یابی دو مکعبی (Bicubic Spline).
            - **ارتقای یکپارچه درجا (In-place Upgrade):** امضا با همان کلید دائم معتبر با `versionCode = 18`.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.3.2.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.3.2/Dnic-GeoScan-v1.3.2.apk)**
          files: release/Dnic-GeoScan-v1.3.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
