name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.3.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.3.3-apk
          path: release/Dnic-GeoScan-v1.3.3.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.3.3
          name: "Dnic-GeoScan v1.3.3 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.3.3 - 5×5 Handheld Sensor Grid & Zero-Duration Instant Splash

            نسخه رسمی ۱.۳.۳ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و قابلیت‌های اصلی این نسخه:
            - **حذف انیمیشن تاخیر اسپلش (`windowSplashScreenAnimationDuration = 0`):**
              - صفر کردن مدت زمان انیمیشن خروج اسپلش جهت انتقال فوری میلی‌ثانیه‌ای به رابط کاربری بدون کوچک‌ترین مکث روی آیکون شش‌ضلعی نئونی.
            - **پشتیبانی اختصاصی از سنسورهای آرایه‌ای کوچک دستی (5×5 Handheld Grid):**
              - اضافه شدن دکمه‌های مستقیم پیش‌نمایش و بارگذاری شبکه ۵×۵ (`⚡ 5×5`) به کارت هاب مأموریت و صفحه تحلیل آفلاین، مناسب سنسورهای مگنتومتر و گرادیومتر دستی پرتابل.
            - **تثبیت پایدار وضعیت عدم اتصال سخت‌افزار (`STATUS: DISCONNECTED • NO HARDWARE CONNECTED`):**
              - نمایش شفاف عدم حضور حسگر بدون ایجاد وقفه در عملکرد نرم‌افزار با قابلیت سوییچ مستقیم به آنالیز محلی.
            - **ارتقای یکپارچه درجا (In-place Upgrade):** امضا با همان کلید دائم معتبر با `versionCode = 19`.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.3.3.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.3.3/Dnic-GeoScan-v1.3.3.apk)**
          files: release/Dnic-GeoScan-v1.3.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
