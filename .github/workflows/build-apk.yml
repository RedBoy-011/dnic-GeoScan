name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.3.9.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.3.9-apk
          path: release/Dnic-GeoScan-v1.3.9.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.3.9
          name: "Dnic-GeoScan v1.3.9 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.3.9 - Lifecycle-Compliant Splash Dismissal & Offline Geophysical Engine
            
            نسخه رسمی ۱.۳.۹ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و اصلاحات کلیدی این نسخه:
            - **اصلاح دقیق چرخه حیات اسپلش (Lifecycle-Compliant Splash):**
              - تفکیک زمان‌بندی `installSplashScreen()` قبل از `super.onCreate()` و اعمال لیسنر خروج و تم نهایی بعد از آن در `MainActivity` جهت جلوگیری از تداخل بازخوانی اتریبیوت‌های تم در اندروید ۱۲ به بالا.
            - **تضمین ۱۰۰٪ آفلاین بودن و عدم وابستگی به سخت‌افزار (Local Analysis Priority):**
              - نشانگر رسمی `100% OFFLINE` در سربرگ صفحه تحلیل محلی به همراه نوار انتخابگر دائمی شبکه‌های ۵×۵، ۱۰×۱۰، ۲۰×۲۰ و ۳۰×۳۰.
            - **اعلام شفاف وضعیت عدم اتصال سخت‌افزار (Disconnected Status):**
              - نمایش بنر `STATUS: DISCONNECTED • NO HARDWARE CONNECTED` به همراه میانبرهای مستقیم به تحلیل آفلاین یا اتصال سنسور در هاب و صفحه ریموت.
            - **ارتقای یکپارچه درجا (In-place Upgrade):** امضا با همان کلید دائم معتبر با `versionCode = 25`.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.3.9.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.3.9/Dnic-GeoScan-v1.3.9.apk)**
          files: release/Dnic-GeoScan-v1.3.9.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
