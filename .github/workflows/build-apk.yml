name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.4.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.4.1-apk
          path: release/Dnic-GeoScan-v1.4.1.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.4.1
          name: "Dnic-GeoScan v1.4.1 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.4.1 - Navigation Route Optimization, Canvas Mount Acceleration & Window Safeguards
            
            نسخه رسمی ۱.۴.۱ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و اصلاحات کلیدی این نسخه:
            - **اصلاح دقیق مسیردهی ناوبری (Navigation Route Optimization):**
              - تصحیح `initialRoute` در ناوبری جهت جلوگیری از تداخل پارامترهای بدون مقدار `{grid}` در `startDestination`.
            - **تسریع و روان‌سازی رندرینگ بوم ۳ بعدی (Canvas Mount Acceleration):**
              - کاهش تأخیر سوار شدن موتور WebView به ۱۰۰ میلی‌ثانیه در `EChartsVisualizer.kt` برای رندرینگ آنی بدون تأخیر در جابه‌جایی صفحات.
            - **تضمین دیدپذیری پنجره اصلی (Window Decor Safeguards):**
              - پیاده‌سازی متد محافظتی `onResume` در `MainActivity.kt` برای جلوگیری از هرگونه تداخل بازگشتی پنجره در رام‌های مختلف اندروید.
            - **ارتقای یکپارچه درجا (In-place Upgrade):** امضا با همان کلید دائم معتبر با `versionCode = 27`.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.4.1.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.4.1/Dnic-GeoScan-v1.4.1.apk)**
          files: release/Dnic-GeoScan-v1.4.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
