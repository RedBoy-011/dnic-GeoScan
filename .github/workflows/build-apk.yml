name: Build Dnic-GeoScan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Dnic-GeoScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Dnic-GeoScan-v1.3.8.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnic-GeoScan-v1.3.8-apk
          path: release/Dnic-GeoScan-v1.3.8.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.3.8
          name: "Dnic-GeoScan v1.3.8 - Official Release"
          body: |
            ## 📱 Dnic-GeoScan v1.3.8 - Confirmed Zero-Hang Splash & Offline Geophysical Priority
            
            نسخه رسمی ۱.۳.۸ اپلیکیشن تخصصی اسکنر ژئوفیزیک و تحلیل سه‌بعدی داده‌های مغناطیس‌سنج **Dnic-GeoScan**.
            
            ### ✨ تغییرات و اصلاحات کلیدی این نسخه:
            - **تثبیت نشانگر وضعیت آفلاین در سربرگ تحلیل داده (100% Offline Status Badge):**
              - افزودن نشانگر نئونی فعال بودن موتور پردازش آفلاین بدون نیاز به سخت‌افزار یا اتصال بلوتوث در بالای صفحه Local Analysis.
            - **انتخابگر پایدار شبکه‌های میدانی (Persistent Grid Selector):**
              - دسترسی دائمی به شبکه‌های ۵×۵، ۱۰×۱۰، ۲۰×۲۰ و ۳۰×۳۰ به همراه هایلایت فعال و تشخیص هوشمند داده‌های فایل در برابر شبکه‌های نمونه.
            - **انتقال بدون معطلی و رفع فریز اسپلش در اندروید ۱۲ به بالا:**
              - فراخوانی لیسنر خروج صریح با متد `remove()` بلافاصله پس از آماده‌سازی اولین فریم، بدون وابستگی به انیماتورهای سیستمی OEM.
            - **نمایش شفاف وضعیت عدم اتصال سخت‌افزار (Disconnected Status):**
              - کارت اعلام وضعیت `STATUS: DISCONNECTED • NO HARDWARE CONNECTED` به همراه دکمه‌های اقدام مستقیم در هاب و صفحه ریموت.
            - **ارتقای یکپارچه درجا (In-place Upgrade):** امضا با همان کلید دائم معتبر با `versionCode = 24`.

            ### 📥 فایل نصبی مستقیم:
            - **[دانلود مستقیم Dnic-GeoScan-v1.3.8.apk](https://github.com/RedBoy-011/dnic-GeoScan/releases/download/v1.3.8/Dnic-GeoScan-v1.3.8.apk)**
          files: release/Dnic-GeoScan-v1.3.8.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
